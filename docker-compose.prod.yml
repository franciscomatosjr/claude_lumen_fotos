# Production stack: Caddy (app + HTTPS) → API → PostgreSQL and SeaweedFS.
# Only Caddy is reachable from outside. Settings come from .env.production (see .env.production.example).
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: lumen-prod

services:
  web:
    build: .
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 8787
      DATABASE_URL: postgres://lumen:${POSTGRES_PASSWORD}@db:5432/lumen
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-lumen-photos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      APP_ORIGIN: ${APP_ORIGIN}
      COOKIE_SECURE: 'true'
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: lumen
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lumen']
      interval: 5s
      retries: 30

  # Photo files. To use Cloudflare R2 or Amazon S3 instead, set S3_ENDPOINT and the keys and remove this service.
  storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/seaweedfs.sh']
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - storage-data:/data
      - ./deploy/seaweedfs.sh:/seaweedfs.sh:ro

volumes:
  db-data:
  storage-data:
  caddy-data:
  caddy-config:
